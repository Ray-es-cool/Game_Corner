<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title id="siteTitle">Home</title>

<!-- SQLite Database Client -->
<script src="sqlite-db.js?v=4"></script>
<script src="shared-state.js?v=4"></script>
<script src="app.js?v=4"></script>

<!-- Shared Styles & Animations -->
<link rel="stylesheet" href="styles.css">
<script src="animations.js"></script>
<!-- Central memories -->
<script src="firebase-config.js"></script>
<script src="global-memory.js"></script>
<script src="user-memory.js"></script>

<script>
function applyTheme(){
    // Prefer user-specific theme when available
    let theme = (window.UserMemory && typeof UserMemory.getTheme === 'function') ? UserMemory.getTheme() : (localStorage.getItem("theme") || "dark");
    let root = document.documentElement;

    if(theme === "dark"){
        root.style.setProperty("--bg", "#000");
        root.style.setProperty("--panel", "#0a0a0a");
        root.style.setProperty("--card", "#1f2937");
        root.style.setProperty("--accent", "#3b82f6");
        root.style.setProperty("--text", "white");
    }

    if(theme === "light"){
        root.style.setProperty("--bg", "#f3f4f6");
        root.style.setProperty("--panel", "#ffffff");
        root.style.setProperty("--card", "#e5e7eb");
        root.style.setProperty("--accent", "#2563eb");
        root.style.setProperty("--text", "#111");
    }

    if(theme === "pink"){
        root.style.setProperty("--bg", "#1a001f");
        root.style.setProperty("--panel", "#2a0a2f");
        root.style.setProperty("--card", "#3b0f42");
        root.style.setProperty("--accent", "#ff4fa3");
        root.style.setProperty("--text", "white");
    }
}
applyTheme();

window.addEventListener("storage", (e)=>{
    if(e.key === "theme" || e.key === 'userMemorySync') applyTheme();
});
</script>

<style>
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text);}

/* NAV */
.nav{
width:80%;
margin:20px auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
border-radius:30px;
background:var(--panel);
box-shadow:0 0 20px rgba(59,130,246,0.4);
}
.nav-center{display:flex;gap:30px;margin:auto;}
.nav a{color:var(--text);text-decoration:none;padding:8px 14px;border-radius:10px;}
.nav a:hover{background:var(--card);}

/* Page-specific: games grid animation */
.games{display:flex;gap:10px;margin-top:10px;}
.game{flex:1;animation:scaleIn 0.3s ease-out backwards;}
.game:nth-child(1){animation-delay:0.1s;}
.game:nth-child(2){animation-delay:0.15s;}
.game:nth-child(3){animation-delay:0.2s;}
.game:nth-child(4){animation-delay:0.25s;}
.user-box{display:flex;align-items:center;gap:10px;}

/* MAIN */
.main{width:80%;margin:auto;display:flex;gap:40px;}

.left{width:260px;display:flex;flex-direction:column;gap:20px;}

.box{
background:var(--panel);
border-radius:20px;
padding:20px;
box-shadow:0 0 15px rgba(59,130,246,0.2);
}

.logo-box{height:220px;display:flex;align-items:center;justify-content:center;position:relative;}
.logo-box img{width:180px;height:180px;border-radius:25px;background:var(--card);}
.edit-site-btn{
padding:8px 14px;font-size:14px;
background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;
}
.admin-site-panel{
display:none;margin-top:16px;padding:16px;border-radius:14px;
background:var(--card);border:2px solid var(--accent);text-align:left;
}
.admin-site-panel h3{margin:0 0 12px 0;font-size:16px;color:var(--accent);}
.admin-site-panel label{display:block;margin-top:10px;font-size:13px;opacity:0.85;}
.admin-site-panel input,.admin-site-panel textarea{
width:100%;margin-top:4px;padding:10px;border:none;border-radius:8px;
background:var(--panel);color:var(--text);box-sizing:border-box;
}
.admin-site-panel textarea{min-height:70px;resize:vertical;}
.admin-save-btn{
margin-top:14px;padding:12px;width:100%;border:none;border-radius:10px;
background:var(--accent);color:white;cursor:pointer;font-size:15px;
}
.site-modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;
align-items:center;justify-content:center;
}
.site-modal-content{
background:var(--panel);padding:24px;border-radius:16px;width:90%;max-width:420px;
}
.site-modal input,.site-modal textarea{
width:100%;margin:8px 0;padding:10px;border:none;border-radius:8px;
background:var(--card);color:var(--text);box-sizing:border-box;
}
.site-modal textarea{min-height:80px;resize:vertical;}
.site-modal-actions{display:flex;gap:10px;margin-top:12px;}
.site-modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;}
.site-modal-actions .save{background:var(--accent);color:white;}
.site-modal-actions .cancel{background:var(--card);color:var(--text);}

.center{flex:1;}
.title{text-align:center;font-size:50px;margin-bottom:10px;}
#sloganText{text-align:center;opacity:0.7;margin-bottom:20px;}

.games-section{
background:var(--panel);
padding:20px;
border-radius:20px;
}

.games{display:flex;gap:10px;margin-top:10px;}

.game{
flex:1;
background:var(--card);
padding:15px;
border-radius:10px;
text-align:center;
}

.token{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:30px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<div></div>

<div class="nav-center">
<a href="index.html">Home</a>
<a href="Games.html">Games</a>
<a href="DailyRewards.html">Daily Rewards</a>
<a href="shop.html">Shop</a>
<a href="settings.html">Settings</a>
<a href="login.html" id="loginLink">Login</a>
</div>

<div class="user-box" id="userBox"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="left">
<div class="box logo-box">
<img id="logoImg" src="https://via.placeholder.com/200">
</div>

<div class="box">
<h3>Updates</h3>
<p id="updatesText">Loading...</p>
</div>

<div class="box admin-site-panel" id="adminSitePanel">
<h3>Game_Master — Edit Home Page</h3>
<label>Site Title</label>
<input type="text" id="inlineSiteTitle" placeholder="Site title">
<label>Logo (URL or upload)</label>
<input type="text" id="inlineSiteLogo" placeholder="https://...">
<input type="file" id="inlineSiteLogoFile" accept="image/*">
<label>Updates</label>
<textarea id="inlineSiteUpdates" placeholder="- New update here"></textarea>
<label>Slogan</label>
<input type="text" id="inlineSiteSlogan" placeholder="Play. Learn. Repeat">
<button class="admin-save-btn" onclick="saveSiteSettings()">Save Home Page</button>
<p id="siteEditMsg" style="font-size:13px;margin-top:8px;"></p>
</div>
</div>

<div class="center">

<div class="title" id="siteName">Home</div>
<div id="sloganText">Play. Learn. Repeat</div>

<div class="games-section">
<h2>Recommended Games</h2>

<div class="games" id="gamesContainer">
<!-- Games rendered here -->
</div>

</div>

</div>
</div>

<div class="token" id="tokens">🪙 0</div>

<script>

/* =========================
   USER STATE (uses SharedState)
========================= */
function loadUserUI(){
    let box = document.getElementById("userBox");
    let loginLink = document.getElementById("loginLink");
    let currentUser = SharedState.currentUser;

    if(!box) return;

    if(currentUser){
        box.innerHTML = `
            <span>${currentUser}</span>
            <button onclick="logoutUser()"
            style="padding:6px 10px;background:#ef4444;border:none;border-radius:6px;color:white;cursor:pointer;">
            Logout
            </button>
        `;
        if(loginLink) loginLink.style.display = "none";
    } else {
        box.innerHTML = "";
        if(loginLink) loginLink.style.display = "block";
    }
}

function logoutUser(){
    SharedState.userLogout();
    location.reload();
}

function loadTokens(){
    let el = document.getElementById("tokens");
    if(!el) return;
    el.innerText = "🪙 " + SharedState.tokens;
}

/* =========================
   SITE SETTINGS (from API)
========================= */
function loadSite(){
    const d = SharedState.siteSettings || {};
    apply({
        title: d.title || "Crit Strike",
        logo: d.logo || "https://via.placeholder.com/200",
        updates: d.updates || "- Ready",
        slogan: d.slogan || "Play. Learn. Repeat"
    });
    document.title = d.title || "Home";
}

function apply(d){
    let el;

    el = document.getElementById("siteName");
    if(el) el.innerText = d.title;

    el = document.getElementById("siteTitle");
    if(el) el.innerText = d.title;

    el = document.getElementById("logoImg");
    if(el) el.src = d.logo;

    el = document.getElementById("updatesText");
    if(el) el.innerHTML = d.updates;

    el = document.getElementById("sloganText");
    if(el) el.innerText = d.slogan;
}

function setupSiteEditor(){
    const panel = document.getElementById("adminSitePanel");
    if(!panel) return;

    if(!SharedState.isGameMaster()){
        panel.style.display = "none";
        return;
    }

    panel.style.display = "block";
    const d = SharedState.siteSettings || {};
    document.getElementById("inlineSiteTitle").value = d.title || "";
    document.getElementById("inlineSiteLogo").value = (d.logo && !String(d.logo).startsWith("data:")) ? d.logo : "";
    document.getElementById("inlineSiteUpdates").value = d.updates || "";
    document.getElementById("inlineSiteSlogan").value = d.slogan || "";
}

function openSiteEditor(){
    setupSiteEditor();
    document.getElementById("adminSitePanel")?.scrollIntoView({ behavior: "smooth" });
}

function closeSiteEditor(){}

function readLogoFile(file){
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (e) => resolve(e.target.result);
        r.onerror = () => reject(new Error("Failed to read logo"));
        r.readAsDataURL(file);
    });
}

async function saveSiteSettings(){
    if(!SharedState.isGameMaster()) return;
    const msg = document.getElementById("siteEditMsg");
    msg.innerText = "Saving...";
    msg.style.color = "";

    try {
        let logo = document.getElementById("inlineSiteLogo").value.trim();
        const logoFile = document.getElementById("inlineSiteLogoFile").files[0];
        if(logoFile) logo = await readLogoFile(logoFile);
        if(!logo) logo = SharedState.siteSettings?.logo || "https://via.placeholder.com/200";

        const settings = {
            title: document.getElementById("inlineSiteTitle").value.trim() || "Crit Strike",
            logo,
            updates: document.getElementById("inlineSiteUpdates").value.trim() || "- Ready",
            slogan: document.getElementById("inlineSiteSlogan").value.trim() || "Play. Learn. Repeat"
        };

        await GlobalMemory.save(settings);
        SharedState.siteSettings = settings;
        localStorage.setItem("shared_site_settings", JSON.stringify(settings));
        SharedState.syncSiteSettings();
        loadSite();
        msg.innerText = "Home page saved!";
        msg.style.color = "#22c55e";
        if(window.CritAnimations?.showToast) CritAnimations.showToast("Site updated");
    } catch(err) {
        msg.innerText = err.message || "Failed to save";
        msg.style.color = "#ef4444";
    }
}

/* =========================
   GAMES (uses SharedState)
========================= */
function loadTopGames(){
    const games = (SharedState.games || [])
        .filter(g => g && g.name && (g.published === true || g.published === 1));
    const top = games
        .sort((a,b) => ((b.plays_week ?? b.players) || 0) - ((a.plays_week ?? a.players) || 0))
        .slice(0, 4);

    const wrap = document.getElementById("gamesContainer");
    if(!wrap) return;

    if(top.length === 0){
        wrap.innerHTML = "<div>No games available yet</div>";
        return;
    }

    wrap.innerHTML = top.map((g,i) => `
        <div class="game">
            <strong>#${i+1} ${g.name}</strong>
            <p>▶ ${(g.plays_week ?? g.players) || 0} plays (this week)</p>
            <button onclick="openGameById('${g.id}')"
            style="padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:white;cursor:pointer;margin-top:8px;">
            ${SharedState.currentUser ? "Play" : "Login Required"}
            </button>
        </div>
    `).join("");
}

function canPlayGames(){
    return !!SharedState.currentUser;
}

function openGameById(gameId){
    if(!canPlayGames()){
        alert("Login required");
        window.location.href = "login.html";
        return;
    }
    window.location.href = "Games.html?playId=" + encodeURIComponent(gameId);
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", async ()=>{
    // Wait for SharedState to finish loading from server
    if(SharedState.initPromise) await SharedState.initPromise;

    loadUserUI();
    loadTokens();
    loadSite();
    loadTopGames();
    setupSiteEditor();

    // Sync on storage changes - SharedState handles most, we just refresh UI
    window.addEventListener("storage", (e) => {
        if(e.key === "userSync") { loadUserUI(); loadTokens(); setupSiteEditor(); }
        if(e.key === "tokenSync") loadTokens();
        if(e.key === "gamesSync") {
            SharedState.reloadGamesForDisplay().then(() => loadTopGames());
        }
        if(e.key === "siteSettingsSync") { loadSite(); }
        if(e.key === "theme") applyTheme();
    });
});

</script>

</body>
</html>
