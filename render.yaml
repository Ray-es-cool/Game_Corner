services:
  - type: web
    name: critstrike
    env: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: sqlite-data
      mountPath: /render_disk
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SQLITE_DB_PATH
        value: /render_disk/critstrike.db
