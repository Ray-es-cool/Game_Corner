services:
  - type: web
    name: critstrike-game-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: critstrike-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_DB_PATH
        value: /var/data/critstrike.db
      - key: GAME_MASTER_PASSWORD
        value: master123
