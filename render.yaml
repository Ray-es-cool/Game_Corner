services:
  - type: web
    name: critstrike-game-server
    env: node
    buildCommand: npm install && rm -rf node_modules/.cache && ls -la
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FORCE_REBUILD
        value: "2026-07-02-game-master-fix"
