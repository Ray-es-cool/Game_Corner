<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Music</title>

<!-- SQLite Database Client -->
<script src="sqlite-db.js?v=4"></script>
<script src="shared-state.js?v=4"></script>
<script src="app.js?v=4"></script>

<!-- Shared State - Hive Mind -->
<script src="shared-state.js"></script>

<!-- Shared Styles & Animations -->
<link rel="stylesheet" href="styles.css">
<script src="animations.js"></script>

<script>
function applyTheme(){
    let theme = localStorage.getItem("theme") || "dark";
    let root = document.documentElement;

    if(theme === "dark"){
        root.style.setProperty("--bg", "#000");
        root.style.setProperty("--panel", "#0a0a0a");
        root.style.setProperty("--card", "#1f2937");
        root.style.setProperty("--accent", "#3b82f6");
        root.style.setProperty("--text", "white");
    }

    if(theme === "light"){
        root.style.setProperty("--bg", "#f3f4f6");
        root.style.setProperty("--panel", "#ffffff");
        root.style.setProperty("--card", "#e5e7eb");
        root.style.setProperty("--accent", "#2563eb");
        root.style.setProperty("--text", "#111");
    }

    if(theme === "pink"){
        root.style.setProperty("--bg", "#1a001f");
        root.style.setProperty("--panel", "#2a0a2f");
        root.style.setProperty("--card", "#3b0f42");
        root.style.setProperty("--accent", "#ff4fa3");
        root.style.setProperty("--text", "white");
    }
}
applyTheme();

window.addEventListener("storage",(e)=>{
    if(e.key === "theme") applyTheme();
});
</script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

.nav{
    width:80%;
    margin:20px auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    border-radius:30px;
    background:var(--panel);
    box-shadow:0 0 20px rgba(59,130,246,0.4);
}

.nav-center{
    display:flex;
    gap:40px;
    margin:auto;
}

.nav a{
    color:var(--text);
    text-decoration:none;
    font-size:18px;
    padding:8px 14px;
    border-radius:10px;
}

.nav a:hover{
    background:var(--card);
}

.user-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.main{
    max-width:800px;
    margin:40px auto;
    padding:20px;
}

.title{
    text-align:center;
    font-size:36px;
    margin-bottom:30px;
}

.upload-section{
    background:var(--panel);
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
}

.upload-section h3{
    margin-bottom:15px;
}

.upload-section input[type="text"]{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    box-sizing:border-box;
}

.upload-section input[type="file"]{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    box-sizing:border-box;
}

.upload-section button{
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-size:16px;
}

.playlist-section{
    background:var(--panel);
    padding:25px;
    border-radius:20px;
}

.song-list{
    list-style:none;
    padding:0;
    margin:0;
}

.song-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    margin:8px 0;
    background:var(--card);
    border-radius:10px;
}

.song-item.playing{
    background:var(--accent);
}

.song-item button{
    padding:8px 16px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    cursor:pointer;
    margin-left:8px;
}

.song-item .play-btn{
    background:var(--accent);
}

.player{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    padding:15px 30px;
    border-radius:30px;
    box-shadow:0 0 20px rgba(59,130,246,0.4);
    display:flex;
    align-items:center;
    gap:15px;
    z-index:1000;
}

.player audio{
    height:40px;
}

.token{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div></div>
    <div class="nav-center">
        <a href="index.html">Home</a>
        <a href="Games.html">Games</a>
        <a href="DailyRewards.html">Daily Rewards</a>
        <a href="shop.html">Shop</a>
        <a href="settings.html">Settings</a>
    </div>
    <div class="user-box" id="userBox"></div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="title">My Music</div>

    <div class="upload-section">
        <h3>Upload Your Song</h3>
        <input type="text" id="songName" placeholder="Song name">
        <input type="file" id="songFile" accept="audio/*">
        <button onclick="uploadSong()">Upload</button>
    </div>

    <div class="playlist-section">
        <h3>My Playlist</h3>
        <ul class="song-list" id="songList"></ul>
    </div>
</div>

<!-- AUDIO PLAYER -->
<div class="player" id="player" style="display:none;">
    <span id="nowPlaying">Now playing:</span>
    <audio id="audioEl" controls></audio>
    <button onclick="closePlayer()" style="padding:8px 16px;border:none;border-radius:8px;background:#ef4444;color:white;cursor:pointer;">Close</button>
</div>

<div class="token" id="tokens">🪙 0</div>

<script>

/* =========================
   USER STATE (uses SharedState)
========================= */
function loadUserUI(){
    let box = document.getElementById("userBox");
    if(!box) return;

    if(SharedState.currentUser){
        box.innerHTML = `
            <span>${SharedState.currentUser}</span>
            <button onclick="logoutUser()"
            style="padding:6px 10px;background:#ef4444;border:none;border-radius:6px;color:white;cursor:pointer;">
            Logout
            </button>
        `;
    } else {
        box.innerHTML = `<a href="login.html">Login</a>`;
    }
}

function logoutUser(){
    SharedState.userLogout();
    location.reload();
}

function loadTokens(){
    let el = document.getElementById("tokens");
    if(!el) return;
    el.innerText = "🪙 " + SharedState.tokens;
}

/* =========================
   PERSONAL PLAYLIST (localStorage)
========================= */
function getPersonalPlaylist(){
    if(!SharedState.currentUser) return [];
    const data = localStorage.getItem(SharedState.currentUser + "_playlist");
    return data ? JSON.parse(data) : [];
}

function savePersonalPlaylist(playlist){
    if(!SharedState.currentUser) return;
    localStorage.setItem(SharedState.currentUser + "_playlist", JSON.stringify(playlist));
    localStorage.setItem("musicSync", Date.now());
}

function uploadSong(){
    if(!SharedState.currentUser){
        alert("Please login to upload music");
        return;
    }

    const name = document.getElementById("songName").value;
    const fileInput = document.getElementById("songFile");
    const file = fileInput.files[0];

    if(!name || !file){
        alert("Please enter a name and select a file");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e){
        const playlist = getPersonalPlaylist();
        playlist.push({
            id: Date.now().toString(),
            name: name,
            data: e.target.result,
            type: file.type,
            uploaded: new Date().toISOString()
        });
        savePersonalPlaylist(playlist);
        renderPlaylist();

        document.getElementById("songName").value = "";
        fileInput.value = "";
        alert("Song uploaded!");
    };
    reader.readAsDataURL(file);
}

function deleteSong(id){
    const playlist = getPersonalPlaylist();
    const filtered = playlist.filter(s => s.id !== id);
    savePersonalPlaylist(filtered);
    renderPlaylist();
}

function playSong(id){
    const playlist = getPersonalPlaylist();
    const song = playlist.find(s => s.id === id);
    if(!song) return;

    const player = document.getElementById("player");
    const audio = document.getElementById("audioEl");
    const nowPlaying = document.getElementById("nowPlaying");

    nowPlaying.innerText = "Now playing: " + song.name;
    audio.src = song.data;
    audio.play();
    player.style.display = "flex";

    // Highlight playing song
    document.querySelectorAll(".song-item").forEach(el => {
        el.classList.remove("playing");
        if(el.dataset.id === id) el.classList.add("playing");
    });
}

function closePlayer(){
    const player = document.getElementById("player");
    const audio = document.getElementById("audioEl");
    audio.pause();
    audio.src = "";
    player.style.display = "none";
    document.querySelectorAll(".song-item").forEach(el => {
        el.classList.remove("playing");
    });
}

function renderPlaylist(){
    const list = document.getElementById("songList");
    if(!list) return;

    const playlist = getPersonalPlaylist();

    if(playlist.length === 0){
        list.innerHTML = `<li style="opacity:0.7;text-align:center;padding:20px;">No songs yet. Upload your first song!</li>`;
        return;
    }

    list.innerHTML = playlist.map(song => `
        <li class="song-item" data-id="${song.id}">
            <span>${song.name}</span>
            <div>
                <button class="play-btn" onclick="playSong('${song.id}')">Play</button>
                <button onclick="deleteSong('${song.id}')">Delete</button>
            </div>
        </li>
    `).join("");
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", ()=>{
    // SharedState already initialized by shared-state.js
    loadUserUI();
    loadTokens();
    renderPlaylist();

    window.addEventListener("storage", (e)=>{
        if(e.key === "musicSync"){
            renderPlaylist();
        }
        if(e.key === "userSync"){
            location.reload();
        }
        if(e.key === "tokenSync"){
            loadTokens();
        }
        if(e.key === "theme"){
            applyTheme();
        }
    });
});

</script>

</body>
</html>
