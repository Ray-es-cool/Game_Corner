<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- SQLite Database Client -->
  <script src="sqlite-db.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#1a1a1a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .box{
      background:#2a2a2a;
      padding:30px;
      width:320px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#fff;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #444;
      border-radius:6px;
      background:#333;
      color:#fff;
      box-sizing:border-box;
    }

    input::placeholder{
      color:#aaa;
    }

    button{
      width:100%;
      padding:12px;
      background:#3b82f6;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
      margin-top:10px;
    }

    button:hover{
      background:#2563eb;
    }

    p{
      text-align:center;
      margin-top:15px;
      color:#aaa;
    }

    a{
      color:#3b82f6;
      text-decoration:none;
    }

    a:hover{
      text-decoration:underline;
    }

    #msg{
      text-align:center;
      margin-top:10px;
      font-size:14px;
    }

    .error{
      color:#ef4444;
    }

    .success{
      color:#22c55e;
    }

    .switch{
      text-align:center;
      margin-top:15px;
      color:#aaa;
    }

    .switch span{
      color:#3b82f6;
      cursor:pointer;
    }

    .switch span:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2 id="title">Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="submit()" id="submitBtn">Login</button>

    <p id="msg"></p>

    <div class="switch" id="switchText">
      Don't have an account? <span onclick="toggleMode()">Register</span>
    </div>

    <p>
      <a href="index.html">← Back to Home</a>
    </p>
  </div>

  <script>
    let isLogin = true;

    function toggleMode(){
      isLogin = !isLogin;
      document.getElementById("title").innerText = isLogin ? "Login" : "Register";
      document.getElementById("submitBtn").innerText = isLogin ? "Login" : "Register";
      document.getElementById("switchText").innerHTML = isLogin
        ? "Don't have an account? <span onclick='toggleMode()'>Register</span>"
        : "Already have an account? <span onclick='toggleMode()'>Login</span>";
      document.getElementById("msg").innerText = "";
    }

    async function submit(){
      let user = document.getElementById("username").value.trim();
      let pass = document.getElementById("password").value;
      let msg = document.getElementById("msg");

      if(!user || !pass){
        msg.innerText = "Please fill in all fields";
        msg.className = "error";
        return;
      }

      if(isLogin){
        // LOGIN
        try {
          const result = await FireDB.login(user, pass);

          if(result){
            localStorage.setItem("currentUser", user);
            localStorage.setItem("currentUid", result.uid);
            localStorage.setItem(user + "_tokens", result.tokens || 0);
            localStorage.setItem("userSync", Date.now());
            window.location.href = "index.html";
          }
        } catch(err){
          console.error(err);
          let errorMsg = err.message || "Login failed";

          if(errorMsg.includes("Invalid") || errorMsg.includes("credentials")){
            msg.innerText = "Invalid username or password";
          } else if(errorMsg.includes("User not found")){
            msg.innerText = "User not found";
          } else if(errorMsg.includes("Server") || errorMsg.includes("connect") || errorMsg.includes("fetch") || errorMsg.includes("Failed")){
            msg.innerText = "Cannot connect to server";
          } else {
            msg.innerText = errorMsg;
          }
          msg.className = "error";
        }
      } else {
        // REGISTER
        try {
          const result = await FireDB.createUser(user, pass, "https://via.placeholder.com/40");

          if(result){
            msg.innerText = "Account created! You can now login.";
            msg.className = "success";
            setTimeout(() => {
              toggleMode();
            }, 1500);
          }
        } catch(err){
          console.error(err);
          let errorMsg = err.message || "Registration failed";

          if(errorMsg.includes("already") || errorMsg.includes("exists") || errorMsg.includes("Username")){
            msg.innerText = "Username already taken";
          } else if(errorMsg.includes("password") || errorMsg.includes("6")){
            msg.innerText = "Password must be at least 6 characters";
          } else if(errorMsg.includes("Server") || errorMsg.includes("connect") || errorMsg.includes("fetch") || errorMsg.includes("Failed")){
            msg.innerText = "Cannot connect to server";
          } else {
            msg.innerText = errorMsg;
          }
          msg.className = "error";
        }
      }
    }

    // Allow Enter key to submit
    document.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        submit();
      }
    });
  </script>

</body>
</html>
