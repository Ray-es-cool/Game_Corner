<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>

<!-- SQLite Database Client -->
<script src="sqlite-db.js?v=5"></script>
<script src="animations.js"></script>

<link rel="stylesheet" href="styles.css">
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#050816;
    color:#f7fafc;
}

.nav{
    width:90%;
    max-width:1200px;
    margin:24px auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 24px;
    border-radius:28px;
    background:rgba(15, 23, 42, 0.95);
    box-shadow:0 16px 40px rgba(59,130,246,0.16);
}

.nav-center{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
}

.nav a{
    color:#f8fafc;
    text-decoration:none;
    padding:10px 16px;
    border-radius:12px;
    transition:background 0.2s ease;
}

.nav a:hover{
    background:rgba(59,130,246,0.14);
}

.user-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.main{
    width:90%;
    max-width:1200px;
    margin:0 auto 40px;
    padding:0 0 30px;
}

.title{
    text-align:center;
    font-size:44px;
    margin:10px auto 24px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:24px;
}

.tab-btn{
    padding:12px 22px;
    border:none;
    border-radius:999px;
    background:rgba(15, 23, 42, 0.85);
    color:#e2e8f0;
    cursor:pointer;
    transition:transform 0.2s ease, background 0.2s ease;
}

.tab-btn:hover{
    transform:translateY(-1px);
    background:rgba(59,130,246,0.16);
}

.tab-btn.active{
    background:#2563eb;
    color:white;
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:22px;
}

.card{
    background:rgba(15, 23, 42, 0.95);
    border-radius:22px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    gap:14px;
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:16px;
    background:#0f172a;
}

.card h3{
    margin:0;
    font-size:22px;
}

.card p{
    margin:0;
    opacity:0.8;
}

.card .meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:14px;
    opacity:0.85;
}

.card .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:auto;
}

.card button{
    flex:1;
    min-width:120px;
    padding:12px 16px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    transition:transform 0.2s ease, opacity 0.2s ease;
}

.card button:hover{
    transform:translateY(-1px);
}

.card button.primary{
    background:#2563eb;
    color:white;
}

.card button.secondary{
    background:rgba(255,255,255,0.08);
    color:#f8fafc;
}

.card button.danger{
    background:#ef4444;
    color:white;
}

.card button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.fab{
    position:fixed;
    right:24px;
    bottom:24px;
    width:68px;
    height:68px;
    border-radius:50%;
    border:none;
    background:#2563eb;
    color:white;
    font-size:44px;
    box-shadow:0 20px 45px rgba(37,99,235,0.35);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1200;
    transition:transform 0.2s ease;
}

.fab:hover{
    transform:scale(1.04);
}

.game-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:1300;
    padding:32px;
    overflow:auto;
}

.modal{
    max-width:700px;
    margin:0 auto;
    background:#0f172a;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 28px;
    background:#111827;
}

.modal-header h2{
    margin:0;
    font-size:24px;
}

.modal-header button{
    border:none;
    background:transparent;
    color:#f8fafc;
    font-size:28px;
    cursor:pointer;
}

.modal-body{
    padding:24px 28px 28px;
    display:grid;
    gap:18px;
}

.modal-body label{
    font-weight:700;
    color:#bfdbfe;
}

.modal-body input,
.modal-body select{
    width:100%;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(148,163,184,0.24);
    background:#111827;
    color:#f8fafc;
}

.modal-body input[type=file] {
    padding:10px 12px;
}

.modal-body .help-text{
    color:#94a3b8;
    font-size:13px;
}

.modal-body .button-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.modal-body .button-row button{
    flex:1;
}

.status-banner{
    width:90%;
    max-width:1200px;
    margin:20px auto;
    padding:16px 20px;
    border-radius:18px;
    background:rgba(37,99,235,0.12);
    color:#dbeafe;
    text-align:center;
}

@media(max-width:700px){
    .nav{flex-direction:column;align-items:flex-start;gap:16px;}
    .game-grid{grid-template-columns:1fr;}
    .modal-body{padding:20px;}
}
</style>
</head>
<body>

<div class="nav">
    <div class="nav-center">
        <a href="index.html">Home</a>
        <a href="Games.html">Games</a>
        <a href="DailyRewards.html">Daily Rewards</a>
        <a href="shop.html">Shop</a>
        <a href="settings.html">Settings</a>
    </div>
    <div class="user-box" id="userBox"></div>
</div>

<div class="main">
    <div class="title">Games</div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="credit">Credit Games</button>
        <button class="tab-btn" data-tab="popular">Most Popular</button>
        <button class="tab-btn" data-tab="noncredit">Non-Credit</button>
    </div>
    <div id="statusBanner" class="status-banner" style="display:none;"></div>
    <div id="gameGrid" class="game-grid"></div>
</div>

<button id="addGameBtn" class="fab" aria-label="Add Game" title="Add Game">+</button>

<div class="game-overlay" id="addGameModal">
    <div class="modal">
        <div class="modal-header">
            <h2>Publish New Game</h2>
            <button onclick="closeAddGame()">×</button>
        </div>
        <div class="modal-body">
            <label>Title</label>
            <input id="newGameTitle" type="text" placeholder="Game title">

            <label>Thumbnail Image</label>
            <input id="newGameThumb" type="file" accept="image/*">

            <label>Game Folder (index.html required)</label>
            <input id="newGameFiles" type="file" webkitdirectory multiple>
            <div class="help-text">Upload a folder containing the game's <strong>index.html</strong> and assets.</div>

            <label>Credit Mode</label>
            <select id="newGameCreditMode">
                <option value="auto">Auto (game decides)</option>
                <option value="credit">Credit game</option>
                <option value="noncredit">Non-credit game</option>
            </select>

            <label style="display:flex;align-items:center;gap:10px;">
                <input id="newGamePublish" type="checkbox" checked>
                Publish immediately
            </label>

            <div class="button-row">
                <button class="primary" onclick="createGameFromModal()">Create</button>
                <button class="secondary" onclick="closeAddGame()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
const ADMIN_NAME = "Game_Master";
let currentUser = localStorage.getItem("currentUser");
let currentUid = localStorage.getItem("currentUid");
let games = [];
let activeTab = "all";
let isAdminUser = false;

function isGameMaster() {
    return String(currentUser || "").trim().toLowerCase() === ADMIN_NAME.toLowerCase();
}

function canManageGames(){
    return isAdminUser || isGameMaster();
}

function setStatus(message){
    const banner = document.getElementById("statusBanner");
    if(!message){ banner.style.display = "none"; return; }
    banner.innerText = message;
    banner.style.display = "block";
}

function loadUserUI(){
    const box = document.getElementById("userBox");
    if(!box) return;
    if(currentUser){
        box.innerHTML = `
            <span style="font-weight:700;">${currentUser}</span>
            <button onclick="logoutUser()" style="padding:8px 14px;border:none;border-radius:12px;background:#ef4444;color:white;cursor:pointer;">Logout</button>
            <span style="font-size:14px;opacity:0.78;">🪙 ${localStorage.getItem(currentUser + "_tokens") || 0}</span>
        `;
    } else {
        box.innerHTML = `<a href="login.html">Login</a>`;
    }
}

function logoutUser(){
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUid");
    currentUser = null;
    currentUid = null;
    localStorage.setItem("userSync", Date.now());
    location.reload();
}

async function resolveAdmin(){
    isAdminUser = false;
    if(!currentUser) return false;
    if(isGameMaster() && !currentUid){
        isAdminUser = true;
        return true;
    }
    if(!currentUid || !window.FireDB) return false;
    try{
        const data = await FireDB.getUserData(currentUid);
        isAdminUser = data?.username === ADMIN_NAME && isGameMaster();
        return isAdminUser;
    } catch {
        isAdminUser = false;
        return false;
    }
}

function updateAddButton(){
    const addBtn = document.getElementById("addGameBtn");
    if(!addBtn) return;
    if(canManageGames()){
        addBtn.style.display = "flex";
        addBtn.onclick = openAddGame;
    } else {
        addBtn.style.display = "none";
    }
}

async function loadGames(){
    if(!window.FireDB){
        setStatus("The game server is not available yet. Refresh when the site is ready.");
        return;
    }
    try{
        const publishedOnly = !isAdminUser;
        games = await FireDB.getGames(publishedOnly);
        renderGames();
        setStatus("");
    } catch(err){
        console.error(err);
        setStatus("Failed to load games. Please refresh the page.");
        games = [];
        renderGames();
    }
}

function sortGames(list){
    return [...list].sort((a,b) => (b.plays_week || 0) - (a.plays_week || 0));
}

function renderGames(){
    const grid = document.getElementById("gameGrid");
    if(!grid) return;
    grid.innerHTML = "";
    let visible = [...games];
    if(activeTab === "credit"){
        visible = visible.filter(g => g.credit_eligible === true);
    } else if(activeTab === "noncredit"){
        visible = visible.filter(g => g.credit_eligible === false);
    } else if(activeTab === "popular"){
        visible = sortGames(visible);
    }
    if(!isAdminUser){
        visible = visible.filter(g => g.published === true);
    }
    if(visible.length === 0){
        grid.innerHTML = `<div style="padding:40px 20px;text-align:center;color:#cbd5e1;opacity:0.85;">No games found in this section.</div>`;
        return;
    }
    visible.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        const publishedText = game.published ? "Published" : "Unpublished";
        const creditText = game.credit_eligible === true ? "Credit" : (game.credit_eligible === false ? "Non-credit" : "Auto");
        card.innerHTML = `
            <img src="${game.thumbnail || 'https://via.placeholder.com/400x240?text=No+Image'}" alt="${game.name}">
            <h3>${game.name || "Untitled Game"}</h3>
            <div class="meta">${creditText} · ${publishedText}</div>
            <div class="meta">${game.plays_week || 0} plays this week · ${game.plays_total || 0} total</div>
            <div class="actions">
                <button class="primary" onclick="playGameById('${game.id}')">Play</button>
                ${canManageGames() ? `<button class="secondary" onclick="openAdminPanel('${game.id}')">Manage</button>` : ""}
            </div>
        `;
        if(canManageGames()){
            const adminRow = document.createElement("div");
            adminRow.className = "actions";
            adminRow.innerHTML = `
                <button class="secondary" onclick="togglePublishById('${game.id}', ${game.published ? 'true' : 'false'})">${game.published ? 'Unpublish' : 'Publish'}</button>
                <button class="danger" onclick="deleteGameById('${game.id}')">Delete</button>
            `;
            card.appendChild(adminRow);
        }
        grid.appendChild(card);
    });
}

function updateTabButtons(){
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        btn.classList.toggle('active', tab === activeTab);
    });
}

function showTab(tab){
    activeTab = tab;
    updateTabButtons();
    renderGames();
}

function openAddGame(){
    if(!canManageGames()) return;
    document.getElementById("addGameModal").style.display = "block";
}

function closeAddGame(){
    document.getElementById("addGameModal").style.display = "none";
}

function clearAddForm(){
    document.getElementById("newGameTitle").value = "";
    document.getElementById("newGameThumb").value = "";
    document.getElementById("newGameFiles").value = "";
    document.getElementById("newGameCreditMode").value = "auto";
    document.getElementById("newGamePublish").checked = true;
}

async function createGameFromModal(){
    if(!canManageGames()){
        alert("Only Game_Master can add games.");
        return;
    }
    const title = document.getElementById("newGameTitle").value.trim();
    const thumbFile = document.getElementById("newGameThumb").files[0];
    const gameFiles = document.getElementById("newGameFiles").files;
    const creditMode = document.getElementById("newGameCreditMode").value;
    const publish = document.getElementById("newGamePublish").checked;
    if(!title){ alert("Enter a title."); return; }
    if(!thumbFile){ alert("Upload a thumbnail."); return; }
    if(!gameFiles || gameFiles.length === 0){ alert("Upload a game folder with index.html."); return; }
    const indexFile = Array.from(gameFiles).find(f => f.name.toLowerCase() === "index.html");
    if(!indexFile){ alert("Game folder must include index.html."); return; }
    const creditEligible = creditMode === "credit" ? true : (creditMode === "noncredit" ? false : null);
    try{
        const thumbData = await readFileAsDataUrl(thumbFile);
        const fileData = await readFilesAsDataUrlMap(gameFiles);
        await FireDB.createGame({
            name: title,
            thumbnail: thumbData,
            gameFiles: fileData,
            entryKey: indexFile.webkitRelativePath || indexFile.name,
            publish,
            creditEligible
        });
        closeAddGame();
        clearAddForm();
        setStatus("Game created successfully.");
        await loadGames();
    } catch(err){
        console.error(err);
        alert("Create error: " + (err.message || err));
    }
}

function readFileAsDataUrl(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsDataURL(file);
    });
}

function readFilesAsDataUrlMap(fileList){
    return new Promise((resolve) => {
        const files = Array.from(fileList || []);
        const result = {};
        let loaded = 0;
        if(files.length === 0){ resolve(result); return; }
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = () => {
                result[file.webkitRelativePath || file.name] = reader.result;
                loaded += 1;
                if(loaded === files.length) resolve(result);
            };
            reader.onerror = () => {
                loaded += 1;
                if(loaded === files.length) resolve(result);
            };
            reader.readAsDataURL(file);
        });
    });
}

async function togglePublishById(gameId, currentlyPublished){
    if(!canManageGames()) return;
    try{
        await FireDB.updateGameById(gameId, { published: !currentlyPublished });
        await loadGames();
    } catch(err){
        alert("Publish failed: " + (err.message || err));
    }
}

async function deleteGameById(gameId){
    if(!canManageGames()) return;
    if(!confirm("Delete this game permanently?")) return;
    try{
        await FireDB.deleteGameById(gameId);
        await loadGames();
    } catch(err){
        alert("Delete failed: " + (err.message || err));
    }
}

function playGameById(gameId){
    if(!currentUser){
        alert("You must be logged in to play.");
        window.location.href = "login.html";
        return;
    }
    window.location.href = `player.html?gameId=${encodeURIComponent(gameId)}`;
}

function openAdminPanel(gameId){
    const game = games.find(g => g.id === gameId);
    if(!game) return;
    const publishAction = game.published ? "Unpublish" : "Publish";
    if(confirm(`Manage game \"${game.name}\"? Press OK to ${publishAction} or Cancel to delete.`)){
        togglePublishById(gameId, game.published);
    }
}

function wireTabs(){
    document.querySelectorAll('.tab-btn').forEach(button => {
        button.addEventListener('click', () => {
            showTab(button.getAttribute('data-tab'));
        });
    });
}

async function initPage(){
    loadUserUI();
    wireTabs();
    await resolveAdmin();
    updateAddButton();
    await loadGames();
}

window.addEventListener('storage', async (event) => {
    if(event.key === 'userSync' || event.key === 'currentUser'){
        currentUser = localStorage.getItem('currentUser');
        currentUid = localStorage.getItem('currentUid');
        loadUserUI();
        await resolveAdmin();
        updateAddButton();
        await loadGames();
    }
    if(event.key === 'gamesSync'){
        await loadGames();
    }
});

window.addEventListener('DOMContentLoaded', initPage);
</script>

</body>
</html>
