<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Games</title>

<!-- SQLite Database Client -->
<script src="sqlite-db.js"></script>

<!-- Shared Styles & Animations -->
<link rel="stylesheet" href="styles.css">
<script src="animations.js"></script>

<script>
function applyTheme(){
    let theme = localStorage.getItem("theme") || "dark";
    let root = document.documentElement;

    if(theme === "dark"){
        root.style.setProperty("--bg", "#000");
        root.style.setProperty("--panel", "#0a0a0a");
        root.style.setProperty("--card", "#1f2937");
        root.style.setProperty("--accent", "#3b82f6");
        root.style.setProperty("--text", "white");
    }

    if(theme === "light"){
        root.style.setProperty("--bg", "#f3f4f6");
        root.style.setProperty("--panel", "#ffffff");
        root.style.setProperty("--card", "#e5e7eb");
        root.style.setProperty("--accent", "#2563eb");
        root.style.setProperty("--text", "#111");
    }

    if(theme === "pink"){
        root.style.setProperty("--bg", "#1a001f");
        root.style.setProperty("--panel", "#2a0a2f");
        root.style.setProperty("--card", "#3b0f42");
        root.style.setProperty("--accent", "#ff4fa3");
        root.style.setProperty("--text", "white");
    }
}
applyTheme();

window.addEventListener("storage",(e)=>{
    if(e.key === "theme") applyTheme();
});
</script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

/* NAV */
.nav{
    width:80%;
    margin:20px auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    border-radius:30px;
    background:var(--panel);
    box-shadow:0 0 20px rgba(59,130,246,0.4);
}

.nav-center{
    display:flex;
    gap:30px;
    margin:auto;
}

.nav a{
    color:var(--text);
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
}

.nav a:hover{
    background:var(--card);
}

.user-box{
    display:flex;
    align-items:center;
    gap:10px;
}

/* MAIN */
.main{
    width:80%;
    margin:auto;
    padding:20px 0;
}

.title{
    text-align:center;
    font-size:40px;
    margin-bottom:20px;
}

/* GAME GRID */
.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
}

.card{
    background:var(--panel);
    border-radius:15px;
    padding:15px;
    box-shadow:0 0 15px rgba(59,130,246,0.2);
    text-align:center;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    background:var(--card);
}

.card h3{
    margin:10px 0 5px;
}

.card p{
    opacity:0.7;
    margin-bottom:10px;
}

.card button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    margin:5px;
}

.card button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

/* Game card hover - enhanced with shared styles */
.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
}

/* ADMIN PANEL */
.admin-panel{
    margin-top:15px;
    padding:15px;
    background:var(--card);
    border-radius:10px;
    text-align:left;
}

.admin-panel input[type="text"],
.admin-panel input[type="file"]{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:5px;
    border:none;
    background:var(--bg);
    color:var(--text);
}

.admin-panel label{
    display:block;
    margin-top:10px;
    font-weight:bold;
    color:var(--accent);
}

.admin-panel button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:var(--accent);
    color:white;
}

.admin-panel .save-btn{
    background:#22c55e;
}

.admin-panel .publish-btn{
    background:var(--accent);
}

.admin-panel .delete-btn{
    background:#ef4444;
}

.admin-panel .publish-btn:disabled{
    background:#4b5563;
    cursor:not-allowed;
}

/* EMPTY SLOT */
.empty-slot{
    background:var(--panel);
    border:2px dashed var(--card);
    border-radius:15px;
    padding:40px 20px;
    text-align:center;
    color:var(--text);
    opacity:0.5;
}

/* GAME OVERLAY */
.game-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:1000;
}

.game-container{
    width:90%;
    height:90%;
    margin:2% auto;
    background:#111;
    border-radius:10px;
    overflow:hidden;
}

.game-frame{
    width:100%;
    height:calc(100% - 50px);
    border:none;
}

.game-header{
    height:50px;
    background:var(--panel);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.game-header button{
    padding:8px 16px;
    background:#ef4444;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* TOKEN */
.token{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
}

/* TABS */
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    justify-content:center;
}

.tab-btn{
    padding:10px 20px;
    background:var(--card);
    color:var(--text);
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.tab-btn.active{
    background:var(--accent);
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div></div>
    <div class="nav-center">
        <a href="index.html">Home</a>
        <a href="Games.html">Games</a>
        <a href="DailyRewards.html">Daily Rewards</a>

</div>

<div class="token" id="tokens">🪙 0</div>

<script>

/* =========================
   STATE
========================= */
let currentUser = localStorage.getItem("currentUser");
let currentUid = localStorage.getItem("currentUid");
let currentCategory = "action";
let currentPlaying = { gameId: null };

/* =========================
   HARDCODED GAMES BY CATEGORY
========================= */
const GAMES_BY_CATEGORY = {
    action: [
        { id: "action1", name: "Street Fighter", thumbnail: "https://via.placeholder.com/300x200?text=Street+Fighter", url: "Games.html?play=streetfighter" },
        { id: "action2", name: "Metal Slug", thumbnail: "https://via.placeholder.com/300x200?text=Metal+Slug", url: "Games.html?play=metalslug" },
        { id: "action3", name: "Contra", thumbnail: "https://via.placeholder.com/300x200?text=Contra", url: "Games.html?play=contra" }
    ],
    puzzle: [
        { id: "puzzle1", name: "Tetris", thumbnail: "https://via.placeholder.com/300x200?text=Tetris", url: "Games.html?play=tetris" },
        { id: "puzzle2", name: "Sudoku", thumbnail: "https://via.placeholder.com/300x200?text=Sudoku", url: "Games.html?play=sudoku" },
        { id: "puzzle3", name: "Match 3", thumbnail: "https://via.placeholder.com/300x200?text=Match+3", url: "Games.html?play=match3" }
    ],
    racing: [
        { id: "racing1", name: "Need for Speed", thumbnail: "https://via.placeholder.com/300x200?text=Need+for+Speed", url: "Games.html?play=nfs" },
        { id: "racing2", name: "Mario Kart", thumbnail: "https://via.placeholder.com/300x200?text=Mario+Kart", url: "Games.html?play=mariokart" },
        { id: "racing3", name: "Hill Climb", thumbnail: "https://via.placeholder.com/300x200?text=Hill+Climb", url: "Games.html?play=hillclimb" }
    ],
    strategy: [
        { id: "strategy1", name: "Chess", thumbnail: "https://via.placeholder.com/300x200?text=Chess", url: "Games.html?play=chess" },
        { id: "strategy2", name: "Tower Defense", thumbnail: "https://via.placeholder.com/300x200?text=Tower+Defense", url: "Games.html?play=towerdefense" },
        { id: "strategy3", name: "RTS Battle", thumbnail: "https://via.placeholder.com/300x200?text=RTS+Battle", url: "Games.html?play=rts" }
    ]
};

/* =========================
   USER UI
========================= */
function loadUserUI(){
    let box = document.getElementById("userBox");
    if(!box) return;

    if(currentUser){
        box.innerHTML = `
            <span>${currentUser}</span>
            <button onclick="logoutUser()"
            style="padding:6px 10px;background:#ef4444;border:none;border-radius:6px;color:white;cursor:pointer;">
            Logout
            </button>
        `;
    } else {
        box.innerHTML = `<a href="login.html">Login</a>`;
    }
}

function logoutUser(){
    if(window.FireDB) FireDB.logout();
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentUid");
    currentUser = null;
    localStorage.setItem("userSync", Date.now());
    location.reload();
}

function loadTokens(){
    let el = document.getElementById("tokens");
    if(!el || !currentUser) return;
    el.innerText = "🪙 " + (localStorage.getItem(currentUser+"_tokens") || 0);
}

/* =========================
   SHOW GAMES BY CATEGORY
========================= */
function showCategory(category){
    currentCategory = category;
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    document.getElementById("tab" + category.charAt(0).toUpperCase() + category.slice(1))?.classList.add("active");
    renderGames();
}

function renderGames(){
    const grid = document.getElementById("gameGrid");
    if(!grid) return;

    grid.innerHTML = "";

    const games = GAMES_BY_CATEGORY[currentCategory] || [];

    if(games.length === 0){
        grid.innerHTML = `<div style="opacity:0.7;text-align:center;padding:40px;">No games in this category yet.</div>`;
        return;
    }

    for(const game of games){
        const canPlay = !!currentUser;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <img src="${game.thumbnail}" alt="${game.name}">
            <h3>${game.name}</h3>
            <button onclick="playGame('${game.url}')" ${canPlay ? "" : "disabled"}>
                ${canPlay ? "Play" : "Login Required"}
            </button>
        `;

        grid.appendChild(card);
    }
}

/* =========================
   PLAY GAME
========================= */
function playGame(url){
    if(!currentUser){
        alert("Login required");
        window.location.href = "login.html";
        return;
    }
    document.getElementById("gameOverlay").style.display = "block";
    document.getElementById("gameFrame").src = url;
}
        alert("Only Game_Master can add games");
        return;
    }

    const title = document.getElementById("newGameTitle")?.value?.trim();
    const thumbFile = document.getElementById("newGameThumb")?.files?.[0];
    const gameFiles = document.getElementById("newGameFiles")?.files;
    const creditMode = document.getElementById("newGameCreditMode")?.value || "auto";
    const publish = !!document.getElementById("newGamePublish")?.checked;

    if(!title){
        alert("Please enter a title");
        return;
    }
    if(!thumbFile){
        alert("Please upload a thumbnail image");
        return;
    }
    if(!gameFiles || gameFiles.length === 0){
        alert("Please upload a game folder (must include index.html)");
        return;
    }

    // Ensure index.html exists
    const indexFile = Array.from(gameFiles).find(f => f.name.toLowerCase() === "index.html");
    if(!indexFile){
        alert("Game folder must contain index.html");
        return;
    }

    const creditEligible =
        creditMode === "credit" ? true :
        creditMode === "noncredit" ? false :
        null;

    const thumbData = await readFileAsDataUrl(thumbFile);
    const fileData = await readFilesAsDataUrlMap(gameFiles);

    try{
        await FireDB.createGame({
            name: title,
            thumbnail: thumbData,
            gameFiles: fileData,
            entryKey: indexFile.webkitRelativePath || indexFile.name,
            publish,
            creditEligible
        });
        if(window.CritAnimations?.showToast) CritAnimations.showToast("Game created");
        closeAddGame();
        await loadGames();
    }catch(err){
        alert("Create error: " + err.message);
    }
}

function readFileAsDataUrl(file){
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = (e) => resolve(e.target.result);
        r.onerror = () => reject(new Error("Failed to read file"));
        r.readAsDataURL(file);
    });
}

function readFilesAsDataUrlMap(fileList){
    return new Promise((resolve) => {
        const files = Array.from(fileList || []);
        const map = {};
        let loaded = 0;
        if(files.length === 0) return resolve(map);
        for(const f of files){
            const r = new FileReader();
            r.onload = (e) => {
                map[f.webkitRelativePath || f.name] = e.target.result;
                loaded++;
                if(loaded === files.length) resolve(map);
            };
            r.onerror = () => {
                loaded++;
                if(loaded === files.length) resolve(map);
            };
            r.readAsDataURL(f);
        }
    });
}

async function togglePublishById(gameId, currentlyPublished){
    if(!isAdminUser) return;
    try{
        await FireDB.updateGameById(gameId, { published: !currentlyPublished });
        await loadGames();
    }catch(err){
        alert("Publish error: " + err.message);
    }
}

async function deleteGameById(gameId){
    if(!isAdminUser) return;
    if(!confirm("Delete this game?")) return;
    try{
        await FireDB.deleteGameById(gameId);
        await loadGames();
    }catch(err){
        alert("Delete error: " + err.message);
    }
}

/* =========================
   PLAY GAME
========================= */
async function playGame(url){
    if(!currentUser){
        alert("Login required to play games");
        window.location.href = "login.html";
        return;
    }

    // Open game in overlay
    const overlay = document.getElementById("gameOverlay");
    const frame = document.getElementById("gameFrame");
    const title = document.getElementById("gameTitle");

    if(overlay && frame){
        title.innerText = "Playing Game";
        frame.src = url;
        overlay.style.display = "block";
    }
}
        if(!currentUid || !currentUser || !Number.isFinite(amount) || amount <= 0) return;

        try{
            if(FireDB.incrementTokens) await FireDB.incrementTokens(currentUid, amount);
        }catch(_) {}

        const key = currentUser + "_tokens";
        const current = parseInt(localStorage.getItem(key), 10) || 0;
        localStorage.setItem(key, String(current + amount));
        localStorage.setItem("tokenSync", Date.now());
        loadTokens();

        if(window.CritAnimations?.showToast) CritAnimations.showToast(`+${amount} 🪙`);
        if(window.CritAnimations?.createConfetti) CritAnimations.createConfetti();
    }
});

// Legacy support for index.html deep-links (?play=slot_index)
async function playGame(slotIndex){
    const raw = (games || []).find(g => g.slot_index === slotIndex);
    if(!raw) return alert("Game not found");
    return playGameById(raw.id);
}

function closeGame(){
    const overlay = document.getElementById("gameOverlay");
    const frame = document.getElementById("gameFrame");

    if(overlay) overlay.style.display = "none";
    if(frame) {
        frame.onload = null;
        frame.src = "";
    }
    currentPlaying.gameId = null;
    currentPlaying.gotCreditResponse = false;
    if(currentPlaying.creditPingTimer) clearTimeout(currentPlaying.creditPingTimer);
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", ()=>{
    loadUserUI();
    loadTokens();
    renderGames();

    const params = new URLSearchParams(window.location.search);
    const playUrl = params.get("play");
    if(playUrl){
        playGame("Games.html?play=" + playUrl);
    }

    // Sync on storage changes
    window.addEventListener("storage", (e)=>{
        if(e.key === "userSync"){
            location.reload();
        }
        if(e.key === "theme"){
            applyTheme();
        }
    });
});

</script>

</body>
</html>
